[project]
name = "ai-health-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AymanSulaiman", email = "saymansulaiman@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[project.scripts]
ai-health-harness = "ai_health_harness:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
