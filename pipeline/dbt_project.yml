name: ai_health_harness
version: "1.0.0"
profile: ai_health_harness
model-paths: ["models"]

models:
  ai_health_harness:
    staging:
      # ponytail: tables, not views. The sources read files by paths relative to the repo
      # root, so a view would break for anything querying from another directory (the dashboard).
      +materialized: table
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
    serving:
      +materialized: table
      +schema: serving

vars:
  # ponytail: 25 points, because one version's own suite runs differ by up to 22 points in
  # the smallest category (dose_change, 18 cases), and the judge's pass rate swings by 10.
  # So the gate uses the deterministic pass rate and only catches big drops; lower this
  # once there are more cases per category or several suite runs per version.
  max_category_drop: 0.25
