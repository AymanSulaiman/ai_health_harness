version: 2

models:
  - name: stg_trace_events
    columns:
      - name: run_id
        data_tests: [unique, not_null]
      - name: suite_run_id
        data_tests: [not_null]
      - name: test_case_id
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('stg_test_cases'), field: case_id }
      - name: agent_version
        data_tests: [not_null]
      - name: prompt_version
        data_tests: [not_null]
      - name: error_stage
        data_tests:
          - accepted_values:
              arguments: { values: [model, parse, score] }
      - name: created_at
        data_tests: [not_null]

  - name: stg_trace_scores
    columns:
      - name: score_id
        data_tests: [unique, not_null]
      - name: run_id
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('stg_trace_events'), field: run_id }
      - name: scorer
        data_tests: [not_null]
      - name: passed
        data_tests: [not_null]

  - name: stg_test_cases
    columns:
      - name: case_id
        data_tests: [unique, not_null]
      - name: dataset_version
        data_tests: [not_null]
